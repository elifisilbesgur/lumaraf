<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0c0b">
<title>LumaRaf</title>
<style>/* LumaRaf · "Lamba Işığı" teması. Token adları LumaNote ile aynıdır (SPEC 3.3). */
:root{
  --bg:#0f0c0b; --surface:#1b1513; --surface2:#251c18; --text:#f5ece1; --muted:#b7a796; --quiet:#7e6f63;
  --accent:#f2b766; --accent2:#c8643c; --line:rgba(242,183,102,.14); --glass:rgba(27,21,19,.86);
  --gold:#e8c27a; --mint:#93b48b; --danger:#ed92a2; --nav:rgba(18,13,11,.96);
  --radius:22px; --safe-top:0px; --safe-bottom:0px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --book:Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
body[data-room="tv"]{ --bg:#08141a; --surface:#0f2026; --surface2:#132a31; --muted:#a3b8b4; --quiet:#6d8582; --accent:#e9a85a; --line:rgba(120,190,190,.16); --glass:rgba(13,30,36,.88); --nav:rgba(8,20,26,.96); }
body[data-room="balcony"]{ --bg:#0d0f1a; --surface:#171a29; --surface2:#1e2234; --muted:#a9acc0; --quiet:#6f7390; --line:rgba(170,180,230,.14); --nav:rgba(12,13,22,.96); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;overscroll-behavior:none;transition:background .35s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.ic{display:block;flex:0 0 auto}

/* Üst satır */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 10px) 16px 6px;flex:0 0 auto}
.logo{font-family:var(--book);font-size:28px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-family:var(--ui);font-size:8.5px;letter-spacing:.42em;color:var(--muted);margin-top:4px;padding-left:2px}
.top-r{display:flex;align-items:center;gap:10px}
.coin{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:7px 13px;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.coin.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.coin-dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b98c3d,inset 1px 1px 0 #f7dfa6;flex:0 0 auto;vertical-align:-2px}
.coin-dot.big{width:30px;height:30px;box-shadow:inset -4px -4px 0 #b98c3d,inset 2px 2px 0 #f7dfa6}
.coin-float{position:absolute;right:8px;top:-4px;color:var(--gold);font-weight:700;animation:float 1.4s ease forwards;pointer-events:none}
@keyframes float{to{transform:translateY(-26px);opacity:0}}
.pet{width:46px;height:32px;display:flex;align-items:center;justify-content:center}
.pet canvas{width:44px;image-rendering:pixelated}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* Görünüm */
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(var(--safe-bottom) + 96px);-webkit-overflow-scrolling:touch}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:12px 2px 2px}
.eyebrow.small{margin:0 0 4px;font-size:9px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-family:var(--book);font-weight:400;font-size:34px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em}
h2.sec{font-family:var(--book);font-weight:400;font-size:22px;margin:24px 2px 10px}
h2.sec small{font-family:var(--ui);font-size:13px;color:var(--muted);margin-left:6px}
.serif{font-family:var(--book)}
.serif.lg{font-size:20px}.serif.xl{font-size:34px;line-height:1.1;font-weight:400;margin:6px 0 14px}
.serif.xl em{color:var(--accent)}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.muted.pad{padding:4px 4px 8px}
.small{font-size:11px}
.center{text-align:center}
.grow{flex:1;min-width:0;text-align:left}
.plain{display:block}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:24px;padding:9px 15px;font-size:14px;color:var(--text);white-space:nowrap;margin-bottom:4px}

/* Sahne */
.scene-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#120d0b;position:relative;box-shadow:0 18px 50px #0007}
#scene{display:block;width:100%;aspect-ratio:160/200;image-rendering:pixelated;touch-action:manipulation}
.scene-card.editing{border-color:var(--accent)}
.edit-banner{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:9px 9px 9px 14px;font-size:13px}
.edit-banner button{background:var(--accent);color:#24170d;border-radius:14px;padding:6px 13px;font-weight:600}
.tools{display:flex;justify-content:space-around;padding:12px 4px 4px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:14px}
.tools button.on{color:var(--accent)}
.room-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.room-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 4px;font-size:13px;color:var(--muted)}
.room-tabs button.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* Kartlar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:10px 0}
.card.hint{padding:18px}
.card.hint .serif{font-size:19px;margin-bottom:4px}
.card.hint .btn{margin-top:10px}
.row-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.row-card .serif{font-size:17px;margin:1px 0}
.round-ic{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mini-spine{width:12px;height:42px;border-radius:2px;flex:0 0 auto;box-shadow:inset -3px 0 0 #0004,inset 0 2px 0 #fff3}
.mini-tape{width:16px;height:42px;border-radius:2px;flex:0 0 auto;box-shadow:inset 0 0 0 2px #0003;background-image:linear-gradient(transparent 22%,#fffc 22%,#fffc 78%,transparent 78%)!important;background-size:10px 100%!important;background-repeat:no-repeat!important;background-position:center!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 12px;cursor:pointer}
.stat b{display:block;font-family:var(--book);font-weight:400;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.balance{display:flex;align-items:center;gap:14px}
.balance b{font-size:20px;font-family:var(--book);font-weight:400}

/* Düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#24170d;border-radius:22px;padding:11px 18px;font-weight:600;font-size:15px}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.wide{display:flex;width:100%;padding:14px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.text{background:transparent;color:var(--muted);font-weight:400}
.btn.danger{background:var(--danger);color:#2a1016}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:3px}
.seg.full{display:flex;width:100%}
.seg button{flex:1;padding:8px 14px;border-radius:13px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#24170d;font-weight:600}
.seg.kind{margin-bottom:12px}
.seg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:6px -16px 12px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:14px;padding:6px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);color:#24170d;border-color:var(--accent);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:9px;background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint);margin-top:4px}

/* Büyük raf (R-KIT) */
.bigshelf{background:#3a2014;border:3px solid #24130b;border-radius:10px;padding:10px 7px 0;box-shadow:inset 0 0 0 1px #6b3a2255,0 14px 40px #0006}
.shelf-row{display:flex;align-items:flex-end;gap:2px;min-height:132px;padding:0 3px;border-bottom:10px solid #6b3a22;box-shadow:inset 0 -2px 0 #24130b,0 1px 0 #8a5a3a;margin-bottom:10px;background:linear-gradient(#1a0c06,#26130b)}
.spine{position:relative;background:var(--c);border-radius:2px 2px 0 0;box-shadow:inset -3px 0 0 #0005,inset 2px 0 0 #fff2,inset 0 3px 0 #fff3;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;transition:transform .2s}
.spine:active{transform:translateY(-6px)}
.spine .st{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--book);font-size:10.5px;color:#fff;opacity:.9;max-height:86%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 0 #0006}
.spine .band{position:absolute;left:0;right:0;height:3px}
.spine .band.b1{top:16%;background:#0004}
.spine .band.b2{top:16%;background:#0004;box-shadow:0 70px 0 #fff4}
.spine.glow,.tapeset.glow{animation:glow 1.2s ease 3}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--accent),0 0 18px var(--accent)}}
.list{display:flex;flex-direction:column;gap:6px}
.list-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.list-row b{display:block;font-weight:400;font-size:16px}
.list-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.tbr{display:flex;flex-direction:column;gap:4px}
.tbr-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbr-row b{display:block;font-weight:400;font-size:15px}.tbr-row small{color:var(--muted);font-size:12px}
.tbr-book{display:block;height:14px;max-width:70px;min-width:44px;background:var(--c);border-radius:2px;box-shadow:inset 0 2px 0 #fff3,inset 0 -2px 0 #0004,inset -6px 0 0 #efe2c8aa;flex:0 0 auto}

/* Kaset rafı (R-FLM) */
.rack{border-radius:10px;padding:10px 8px 0;margin-bottom:6px}
.rack.wood{background:#5a3a22;border:3px solid #3a2414}
.rack.teal{background:#173e42;border:3px solid #0d2a2c}
.rack-row{display:flex;align-items:flex-end;gap:3px;min-height:112px;border-bottom:8px solid #3a2414;margin-bottom:10px;padding:0 2px;background:#00000040}
.rack.teal .rack-row{border-bottom-color:#0d2a2c}
.tapeset{display:flex;gap:0;flex:0 0 auto}
.tapeset.box{padding:3px 2px 0;background:#e8c27a;border-radius:3px 3px 0 0}
.tape{width:18px;height:100px;background:var(--c);border-radius:2px;position:relative;display:flex;justify-content:center;box-shadow:inset -3px 0 0 #0004,inset 0 0 0 1px #fff3}
.tape.faded{opacity:.38}
.tape .lbl{position:absolute;top:11px;bottom:11px;left:3px;right:3px;background:#f7f1e6;border-radius:1px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;color:#2a1a12;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-weight:600}

/* Mağaza */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.item-card small{color:var(--muted);font-size:11px;margin-top:6px}
.item-card b{font-weight:500;font-size:14px;line-height:1.25}
.price{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:var(--surface2);border-radius:12px;padding:5px 10px;font-size:13px;align-self:flex-start}
.price.short{opacity:.6}
.thumb{height:96px;flex:0 0 96px;min-height:0;border-radius:14px;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb canvas{image-rendering:pixelated;max-width:90%;max-height:86%;width:auto;height:auto}
.thumb.sofa canvas,.thumb.rug canvas,.thumb.tapes canvas,.thumb.tv canvas{width:84%}
.thumb.bookcase canvas{height:88%}
.thumb.lights canvas{width:96%}
.thumb.lamp canvas,.thumb.plant canvas,.thumb.table canvas,.thumb.art canvas,.thumb.btable canvas,.thumb.tvseat canvas,.thumb.music canvas,.thumb.chair canvas{height:78%}
.thumb.cat canvas{width:60%}
.thumb.view canvas{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;display:block}
.pick .thumb{flex-basis:70px}

/* Alttan açılan sayfa */
.sheet-layer{position:fixed;inset:0;pointer-events:none;z-index:20}
.sheet-layer .dim{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .22s}
.sheet-layer .sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:78%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px #000a}
.sheet-layer.open{pointer-events:auto}
.sheet-layer.open .dim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--quiet);margin:9px auto 2px;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:4px 18px calc(var(--safe-bottom) + 22px)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 0 12px}
.sheet-head h2{font-family:var(--book);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.sheet-actions{margin-top:16px;display:flex;gap:8px}
.sheet-actions.col{flex-direction:column}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:12px;padding:9px 11px;margin:10px 0 0;line-height:1.4}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.field>span em{font-style:normal;color:var(--quiet);margin-left:4px}
.field input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;outline:none}
.field input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:30px;height:30px;border-radius:8px;background:var(--c);border:2px solid transparent;box-shadow:inset -4px 0 0 #0004}
.sw.on{border-color:var(--text)}
.sw.auto{width:auto;padding:0 9px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);box-shadow:none}
.sw.auto.on{border-color:var(--accent);color:var(--text)}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 9px;text-align:center}
.pick .thumb{height:70px;border-radius:11px;margin-bottom:6px}
.pick b{display:block;font-weight:500;font-size:12px;line-height:1.2}
.pick small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.pick small .coin-dot{width:10px;height:10px;margin-right:3px}
.pick.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pick.locked .thumb canvas{opacity:.75}
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.room-card .thumb{height:78px;margin-bottom:8px}
.room-card b{display:block;font-size:15px;font-weight:600}
.room-card small{color:var(--muted);font-size:12px}
.room-card.on{border-color:var(--accent)}
.room-card.soon{opacity:.4}
.room-card.soon .thumb{border:2px dashed var(--quiet);background:none}
.item-hero{height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%),var(--surface);border-radius:20px;margin-bottom:10px}
.item-hero canvas{image-rendering:pixelated;max-width:86%;max-height:84%;width:auto;height:84%}
.finish-hero{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.big-spine{display:block;height:110px;background:var(--c);border-radius:3px 3px 0 0;flex:0 0 auto;box-shadow:inset -5px 0 0 #0005,inset 0 4px 0 #fff3,0 0 26px color-mix(in srgb,var(--accent) 35%,transparent)}
.big-tape{display:block;width:30px;height:110px;background:var(--c);border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 2px #fff3;background-image:linear-gradient(transparent 12%,#f7f1e6 12%,#f7f1e6 88%,transparent 88%);background-size:20px 100%;background-repeat:no-repeat;background-position:center}
.card.verify{border-style:dashed;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.card.verify p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.card.verify b{color:var(--text)}
.reward{background:var(--surface);border-radius:16px;padding:10px 14px;margin-top:10px}
.reward div{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
.reward .tot{color:var(--gold);font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.reward div:only-child{border:0;margin:0;padding:3px 0}
.rate{display:flex;justify-content:center;gap:8px;padding:6px 0}
.rate button{color:var(--quiet)}.rate button.on{color:var(--gold)}
.rate button.on .ic{fill:currentColor}
.season-row{display:flex;flex-wrap:wrap;gap:6px}
.season-row button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.season-row button.on{background:var(--c);color:#fff;border-color:transparent}
.toggle-row{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;text-align:left}
.toggle-row b{display:block;font-weight:600}.toggle-row small{color:var(--muted);font-size:12px}
.switch{width:46px;height:28px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--quiet);transition:.2s}
.switch.on{background:color-mix(in srgb,var(--accent) 70%,transparent)}.switch.on:after{left:21px;background:#fff}
.slider{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:4px 10px;margin:0 0 14px}
.slider span b{font-weight:500;font-size:14px}.slider span small{color:var(--muted);font-size:11px;margin-left:6px}
.slider input{grid-column:1/2;width:100%;accent-color:var(--accent)}
.slider em{grid-row:1/3;grid-column:2;font-style:normal;color:var(--muted);font-size:13px;text-align:right}
.about p{margin:6px 0}
.welcome ol{padding-left:20px;margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.5}
.welcome li{margin-bottom:8px}.welcome li b{color:var(--text)}

/* Alt gezinme */
.nav{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-bottom) + 10px);height:62px;border-radius:30px;background:var(--nav);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--quiet);padding:7px 10px;border-radius:20px;min-width:56px}
.nav button em{font-style:normal}

/* ---------- Köprü ---------- */
const Native = {
  _n:0, _wait:new Map(),
  available(){ return !!window.ReactNativeWebView; },
  call(type,payload={}){
    if(!this.available() && window.PreviewNative) return window.PreviewNative.call(type,payload);
    return new Promise((resolve,reject)=>{
      const id='m'+(++this._n)+'-'+Date.now();
      const timer=setTimeout(()=>{this._wait.delete(id);reject(new Error('Telefon yanıt vermedi.'));},20000);
      this._wait.set(id,{resolve,reject,timer});
      window.ReactNativeWebView.postMessage(JSON.stringify({id,type,payload}));
    });
  }
};
window.__rafReceive = function(msg){
  if(msg && msg.replyTo){
    const w=Native._wait.get(msg.replyTo); if(!w) return;
    Native._wait.delete(msg.replyTo); clearTimeout(w.timer);
    msg.error ? w.reject(new Error(msg.error)) : w.resolve(msg.result);
    return;
  }
  if(!msg||!msg.type) return;
  if(msg.type==='notice') toast(String(msg.payload||''));
  else if(msg.type==='back'){ if(UI.sheet) closeSheet(); else if(UI.edit){UI.edit=false;UI.preview=null;render();} else if(UI.tab!=='home') go('home'); }
  else if(msg.type==='background'){ Scene.pause(); persistNow(); }
  else if(msg.type==='resume'){ Scene.resume(); syncAudio(); }
  else if(msg.type==='audioError'){ toast('Ses çalınamadı: '+String(msg.payload||'').slice(0,80)); if(S){S.prefs.soundOn=false;persist();renderHeader();} }
};
window.addEventListener('error',e=>{try{Native.call('diagnostic',{message:String(e.message||e.error)}).catch(()=>{});}catch{}});

/* ---------- Kayıt (R-VER-01/02) ---------- */
let saveTimer=null, saveChain=Promise.resolve();
function persist(){ clearTimeout(saveTimer); saveTimer=setTimeout(persistNow,260); }
function persistNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!S) return Promise.resolve();
  const snapshot=JSON.parse(JSON.stringify(S));
  UI.saving='saving';
  saveChain=saveChain.then(()=>Native.call('save',{state:snapshot})).then(()=>{UI.saving='saved';},e=>{UI.saving='error';toast('Kaydedilemedi: '+e.message);throw e;});
  return saveChain.catch(()=>{});
}

/* ---------- Bildirim ---------- */
let toastTimer=null;
function toast(text,kind=''){
  const el=$('#toast'); if(!el) return;
  el.textContent=text; el.className='toast show '+kind;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',2600);
}

/* ---------- Alttan açılan sayfa ---------- */
function openSheet(name,args={}){ UI.sheet={name,args}; renderSheet(); }
function closeSheet(){
  const layer=$('#sheetLayer'); if(!layer) return;
  if(UI.preview){ UI.preview=null; Scene.redraw(); }
  layer.classList.remove('open'); UI.sheet=null;
  setTimeout(()=>{ if(!UI.sheet) layer.innerHTML=''; },220);
}
function renderSheet(){
  const layer=$('#sheetLayer'); if(!UI.sheet){ layer.innerHTML=''; return; }
  const fn=Sheets[UI.sheet.name]; if(!fn) return;
  const keep=layer.querySelector('.sheet-body'); const scroll=keep?keep.scrollTop:0;
  layer.innerHTML=`<div class="dim" data-act="closeSheet"></div><section class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body">${fn(UI.sheet.args)}</div></section>`;
  requestAnimationFrame(()=>layer.classList.add('open'));
  const body=layer.querySelector('.sheet-body'); if(body) body.scrollTop=scroll;
  hydrate(layer);
}

/* ---------- Gezinme ---------- */
function go(tab,opts={}){
  UI.tab=tab; UI.edit=false; UI.preview=null;
  if(opts.room) UI.room=opts.room;
  if(UI.sheet) closeSheet();
  render();
  const main=$('#view'); if(main) main.scrollTop=opts.scrollTo?main.scrollTop:0;
  if(opts.scrollTo) requestAnimationFrame(()=>{const t=$(opts.scrollTo); if(t) t.scrollIntoView({block:'start',behavior:'smooth'});});
}

/* ---------- Olay yönlendirme: data-act="ad" data-*="..." ---------- */
const Actions = {};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=Actions[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-input]'); if(!el) return;
  const fn=Actions[el.dataset.input]; if(fn) fn(el.dataset,el,e);
});
Actions.closeSheet=()=>closeSheet();
Actions.go=d=>go(d.tab,{room:d.room,scrollTo:d.scroll});

const SCHEMA = 1;

function freshRoom(key){
  const slots={};
  for(const slot of ROOMS[key].slots) slots[slot]=DEFAULT_ITEM[SLOT_TYPE[slot]];
  return { slots, lightOn:true, mix:{...DEFAULT_MIX[key]} };
}
function freshState(){
  const s={
    schema:SCHEMA, createdAt:nowISO(), deviceId:uid('d'),
    books:{}, reading:[], media:{}, watch:[],
    ledger:[], owned:[],
    rooms:Object.fromEntries(ROOM_ORDER.map(k=>[k,freshRoom(k)])),
    lastRoom:'reading',
    companion:{itemId:'cat_tabby',name:'Mırnav'},
    prefs:{ soundOn:true, weather:'rain', sky:'night', animations:true, shelfSort:'date', intro:false }
  };
  award(s,'welcome',ECONOMY.welcome,'welcome');
  return s;
}

/* R-VER-03: normalize asla jeton veya eşya üretmez; yalnızca biçimi düzeltir. */
function normalize(raw){
  const s=raw&&typeof raw==='object'?raw:{};
  const out=freshState(); out.ledger=[]; // hoş geldin hediyesi yalnızca gerçekten yeni kayıtta verilir
  out.schema=SCHEMA;
  out.createdAt=s.createdAt||out.createdAt; out.deviceId=s.deviceId||out.deviceId;
  out.books=s.books&&typeof s.books==='object'?s.books:{};
  out.reading=Array.isArray(s.reading)?s.reading.filter(r=>r&&out.books[r.bookId]):[];
  out.media=s.media&&typeof s.media==='object'?s.media:{};
  out.watch=Array.isArray(s.watch)?s.watch.filter(w=>w&&out.media[w.mediaId]):[];
  // defter: refKey tekilleştirme
  const seen=new Set(); out.ledger=[];
  for(const tx of Array.isArray(s.ledger)?s.ledger:[]){
    if(!tx||typeof tx.amount!=='number'||!tx.refKey||seen.has(tx.refKey)) continue;
    seen.add(tx.refKey); out.ledger.push(tx);
  }
  out.owned=(Array.isArray(s.owned)?s.owned:[]).filter(o=>o&&ITEM[o.itemId]&&ITEM[o.itemId].price>0);
  for(const key of ROOM_ORDER){
    const r=(s.rooms&&s.rooms[key])||{};
    const room=freshRoom(key);
    for(const slot of ROOMS[key].slots){
      const id=r.slots&&r.slots[slot];
      if(id&&ITEM[id]&&ITEM[id].type===SLOT_TYPE[slot]&&(ITEM[id].price===0||out.owned.some(o=>o.itemId===id))) room.slots[slot]=id;
    }
    room.lightOn=r.lightOn!==false;
    if(r.mix) room.mix={...room.mix,...r.mix};
    out.rooms[key]=room;
  }
  // tek kopya: aynı eşya iki yuvadaysa ilki kalır
  const used=new Set();
  for(const key of ROOM_ORDER) for(const slot of ROOMS[key].slots){
    const id=out.rooms[key].slots[slot], it=ITEM[id];
    if(it.price===0||it.multi) continue;
    if(used.has(id)) out.rooms[key].slots[slot]=DEFAULT_ITEM[it.type]; else used.add(id);
  }
  out.lastRoom=ROOMS[s.lastRoom]?s.lastRoom:'reading';
  const c=s.companion||{};
  out.companion={itemId:(ITEM[c.itemId]&&(ITEM[c.itemId].price===0||out.owned.some(o=>o.itemId===c.itemId)))?c.itemId:'cat_tabby',name:String(c.name||'Mırnav').slice(0,24)};
  out.prefs={...out.prefs,...(s.prefs||{})};
  return out;
}

/* ---------- Jeton defteri (R-EKO-01/02) ---------- */
function balance(s=S){ return s.ledger.reduce((t,x)=>t+x.amount,0); }
function hasRef(refKey,s=S){ return s.ledger.some(x=>x.refKey===refKey); }
function award(s,reason,amount,refKey){
  if(!amount||s.ledger.some(x=>x.refKey===refKey)) return 0;
  s.ledger.push({id:uid('t'),at:nowISO(),amount,reason,refKey});
  return amount;
}

/* ---------- Kitaplar ---------- */
function pageBonus(pages){ return Math.min(ECONOMY.pageMax,Math.floor((Number(pages)||0)/100)*ECONOMY.pagePer100); }
function readReward(book){ return ECONOMY.interimRewards ? ECONOMY.readBase+pageBonus(book.pageCount) : 0; }
function spineColorFor(title,author){ return SPINE_COLORS[hash(norm(title)+'|'+norm(author))%SPINE_COLORS.length]; }
function findBookEntry(title,author){
  const k=norm(title)+'|'+norm(author);
  return S.reading.find(r=>{const b=S.books[r.bookId];return b&&norm(b.title)+'|'+norm(b.authors.join(', '))===k;});
}
function addBook({title,author,pages,status,color}){
  title=String(title||'').trim().slice(0,140); author=String(author||'').trim().slice(0,100);
  if(!title) throw new Error('Kitabın adını yaz.');
  const existing=findBookEntry(title,author);
  if(existing){
    if(existing.status==='read') throw new Error('Bu kitap zaten rafında.');
    return {entry:existing,existed:true};
  }
  const id=uid('b');
  const book={id,title,authors:author?[author]:[],pageCount:pages?clamp(Math.round(Number(pages)),1,5000):null,
    kind:'fiction',spineColor:color&&SPINE_COLORS.includes(color)?color:spineColorFor(title,author),source:'manual',createdAt:nowISO()};
  S.books[id]=book;
  const entry={id:uid('r'),bookId:id,status:'planned',addedAt:nowISO(),readCount:0};
  S.reading.push(entry);
  if(status==='reading') entry.status='reading', entry.startedAt=nowISO();
  return {entry,existed:false};
}
function startReading(entry){ entry.status='reading'; entry.startedAt=entry.startedAt||nowISO(); }
function planAgain(entry){ entry.status='planned'; delete entry.startedAt; }
/* Okudum → rafa. Doğrulama bağlanınca burası özet/test sonucunu bekleyecek (R-DOG-40/41). */
function finishBook(entry){
  const book=S.books[entry.bookId];
  entry.status='read'; entry.finishedAt=nowISO(); entry.readCount=(entry.readCount||0)+1;
  entry.verification={method:'interim',at:nowISO(),score:null,perfect:false};
  let gained=0;
  if(ECONOMY.interimRewards){
    gained+=award(S,'read_base',ECONOMY.readBase,'book:'+book.id+':read_base');
    gained+=award(S,'page_bonus',pageBonus(book.pageCount),'book:'+book.id+':page_bonus');
  }
  return gained;
}
function removeBook(entry){
  S.reading=S.reading.filter(r=>r!==entry);
  delete S.books[entry.bookId]; // R-EKO-03: kazanılan jeton defterde kalır
}
function readBooks(){
  const list=S.reading.filter(r=>r.status==='read');
  const by=S.prefs.shelfSort;
  const B=r=>S.books[r.bookId];
  if(by==='author') list.sort((a,b)=>(B(a).authors[0]||'').localeCompare(B(b).authors[0]||'','tr'));
  else if(by==='color') list.sort((a,b)=>SPINE_COLORS.indexOf(B(a).spineColor)-SPINE_COLORS.indexOf(B(b).spineColor));
  else if(by==='title') list.sort((a,b)=>B(a).title.localeCompare(B(b).title,'tr'));
  else list.sort((a,b)=>String(a.finishedAt).localeCompare(String(b.finishedAt)));
  return list;
}
const plannedBooks=()=>S.reading.filter(r=>r.status==='planned').sort((a,b)=>String(a.addedAt).localeCompare(String(b.addedAt)));
const readingBooks=()=>S.reading.filter(r=>r.status==='reading').sort((a,b)=>String(b.startedAt).localeCompare(String(a.startedAt)));
const readThisYear=()=>{const y=new Date().getFullYear();return S.reading.filter(r=>r.status==='read'&&r.finishedAt&&new Date(r.finishedAt).getFullYear()===y).length;};
/* R-KIT-01..04: deterministik sırt */
function spineFor(book){
  const h=hash(norm(book.title)+'|'+norm((book.authors||[]).join(',')));
  const w=book.pageCount?clamp(Math.round(book.pageCount/60),3,10):5;
  return {w,hClass:h%3,band:(h>>4)%3,color:book.spineColor||SPINE_COLORS[(h>>3)%SPINE_COLORS.length]};
}

/* ---------- Film & dizi ---------- */
function addMedia({title,kind,year,seasons,status}){
  title=String(title||'').trim().slice(0,140);
  if(!title) throw new Error('Yapımın adını yaz.');
  kind=kind==='series'?'series':'movie';
  const k=norm(title)+'|'+kind;
  const ex=S.watch.find(w=>{const m=S.media[w.mediaId];return m&&norm(m.title)+'|'+m.kind===k;});
  if(ex) throw new Error(ex.status==='watched'?'Bu yapım zaten rafında.':'Bu yapım zaten listende.');
  const id=uid('m');
  const n=kind==='series'?clamp(Math.round(Number(seasons)||1),1,30):null;
  S.media[id]={id,kind,title,year:year?clamp(Math.round(Number(year)),1888,2100):null,seasons:n,spineColor:spineColorFor(title,kind),createdAt:nowISO()};
  const entry={id:uid('w'),mediaId:id,status:status==='watched'?'watched':status==='watching'?'watching':'planned',addedAt:nowISO()};
  if(entry.status==='watched'){entry.watchedAt=nowISO(); if(n) entry.seasonsWatched=Array.from({length:n},(_,i)=>i+1);}
  else entry.seasonsWatched=[];
  S.watch.push(entry);
  return entry;
}
function setWatch(entry,status){
  if(status==='watching'){ for(const w of S.watch) if(w.status==='watching'&&w!==entry) w.status='planned'; }
  entry.status=status;
  const m=S.media[entry.mediaId];
  if(status==='watched'){ entry.watchedAt=nowISO(); if(m.seasons&&!(entry.seasonsWatched||[]).length) entry.seasonsWatched=Array.from({length:m.seasons},(_,i)=>i+1); }
}
function removeMedia(entry){ S.watch=S.watch.filter(w=>w!==entry); delete S.media[entry.mediaId]; }
const watchedList=()=>S.watch.filter(w=>w.status==='watched').sort((a,b)=>String(a.watchedAt).localeCompare(String(b.watchedAt)));
const plannedMedia=()=>S.watch.filter(w=>w.status!=='watched').sort((a,b)=>String(a.addedAt).localeCompare(String(b.addedAt)));
const watchingNow=()=>S.watch.find(w=>w.status==='watching');

/* ---------- Mağaza, sahiplik, yerleştirme (R-EV-10..13, R-EKO-04) ---------- */
const owns=id=>ITEM[id]&&(ITEM[id].price===0||S.owned.some(o=>o.itemId===id));
function buy(id){
  const it=ITEM[id]; if(!it) throw new Error('Ürün bulunamadı.');
  if(owns(id)) return false;
  if(balance()<it.price) throw new Error('Jetonun yetmiyor.');
  const tx={id:uid('t'),at:nowISO(),amount:-it.price,reason:'purchase',refKey:'buy:'+id};
  if(hasRef(tx.refKey)) throw new Error('Bu ürün zaten satın alınmış görünüyor.');
  S.ledger.push(tx); S.owned.push({itemId:id,at:tx.at,txId:tx.id});
  return true;
}
function whereIs(id){
  const out=[];
  for(const key of ROOM_ORDER) for(const slot of ROOMS[key].slots) if(S.rooms[key].slots[slot]===id) out.push({room:key,slot});
  return out;
}
function slotsFor(type){
  const out=[];
  for(const key of ROOM_ORDER) for(const slot of ROOMS[key].slots) if(SLOT_TYPE[slot]===type) out.push({room:key,slot});
  return out;
}
function place(id,room,slot){
  const it=ITEM[id];
  if(!it||SLOT_TYPE[slot]!==it.type) throw new Error('Bu eşya oraya uymuyor.');
  if(!owns(id)) throw new Error('Önce satın almalısın.');
  if(it.price>0&&!it.multi) for(const w of whereIs(id)) S.rooms[w.room].slots[w.slot]=DEFAULT_ITEM[it.type];
  S.rooms[room].slots[slot]=id;
}
function itemIn(room,slot){
  if(UI.preview&&UI.preview.room===room&&UI.preview.slot===slot) return ITEM[UI.preview.itemId];
  return ITEM[S.rooms[room].slots[slot]];
}
function setCompanion(id){ if(!owns(id)) throw new Error('Önce satın almalısın.'); S.companion.itemId=id; }


/* art.js */

const Art = (()=>{
  const R=(g,x,y,w,h,c)=>{ if(w<=0||h<=0) return; g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };

      // yakın bloklar ve pencereler

        R(g,bx,top,bw,bhh,look.kind==='sakura'?'#2b2238':C.navy); R(g,bx,top,bw,1,'#3a3f5c');

      R(g,x,sea-6,w,6,'#1a1f30'); for(let i=0;i<w;i+=7) R(g,x+i,sea-6-rnd()*5,7,6,'#1a1f30');

      R(g,x,y+h-2,w,2,hexA(C.cream,.65));
    }
    if(look.kind==='sakura'&&env.anim!==false){ const rr=rng(31); for(let i=0;i<10;i++){ const dy=(rr()*h+t*8)%h; P(g,x+(rr()*w+Math.sin(t+i)*3+w)%w,y+dy,C.pink);} }

  }
  // Cam üzerindeki yağmur izleri (Referans 1)
  function glassDrips(g,x,y,w,h,t,on){
    if(!on) return; const rr=rng(hash('drip'+x+w));
    for(let i=0;i<w;i+=2){ const len=1+Math.floor(rr()*rr()*9); R(g,x+i,y,1,len,hexA(C.rain,.55)); }

  }
  function windowFrame(g,x,y,w,h,panes,col,dark){
    R(g,x-3,y-3,w+6,3,col); R(g,x-3,y+h,w+6,3,col); R(g,x-3,y,3,h,col); R(g,x+w,y,3,h,col);

  }

  /* ---------------- Kitaplık ---------------- */
  function bookcase(g,x,y,look,books,t,opt={}){
    const w=38,h=140,n=look.shelves;
    R(g,x,y,w,h,look.frame); R(g,x+3,y+4,w-6,h-10,look.back);
    R(g,x,y,w,3,look.frame); R(g,x-1,y,w+2,2,LT(.18)); R(g,x,y+h-6,w,6,look.dark);
    R(g,x+w-2,y,2,h,DK(.25));
    const innerTop=y+4, innerH=h-10, ch=Math.floor((innerH-(n-1)*2)/n), innerW=w-6;
    const comps=[]; for(let i=0;i<n;i++){ const cy=innerTop+i*(ch+2); comps.push({y:cy,h:ch}); if(i<n-1){R(g,x+3,cy+ch,w-6,2,look.frame);R(g,x+3,cy+ch+1,w-6,1,DK(.25));} }
    // kitapları rafa diz
    let ci=0, cx=x+3; const overflow=[]; const hl=opt.highlight;
    for(const b of books){
      const sp=b.spine; if(ci>=n){ overflow.push(b); continue; }
      if(cx+sp.w>x+3+innerW){ ci++; cx=x+3; if(ci>=n){ overflow.push(b); continue; } }
      const comp=comps[ci]; const bh=Math.max(8,comp.h-2-[7,4,1][sp.hClass]);
      const by=comp.y+comp.h-bh;
      R(g,cx,by,sp.w,bh,sp.color); R(g,cx,by,sp.w,1,LT(.22)); R(g,cx+sp.w-1,by,1,bh,DK(.28));
      if(sp.band>0) R(g,cx,by+Math.floor(bh*.22),sp.w,1,DK(.3));
      if(sp.band>1) R(g,cx,by+Math.floor(bh*.75),sp.w,1,LT(.3));
      if(sp.gold) R(g,cx,by+1,sp.w,2,C.gold);
      if(hl&&b.id===hl){ const a=.5+.5*Math.sin(t*6); R(g,cx-1,by-1,sp.w+2,1,hexA(C.lamp,a)); R(g,cx-1,by-1,1,bh+1,hexA(C.lamp,a)); R(g,cx+sp.w,by-1,1,bh+1,hexA(C.lamp,a)); }
      cx+=sp.w;
    }
    // boş raflara küçük süsler
    comps.forEach((comp,i)=>{
      const used = i<ci ? innerW : i===ci ? cx-(x+3) : 0;

    case 'sofa': case 'tvseat': case 'chair': case 'plant': case 'plant2': case 'rug': case 'art': case 'btable': case 'bookcaseEdit':

    case 'lamp': S.rooms[room].lightOn=!S.rooms[room].lightOn; persist(); Scene.redraw(); toast(S.rooms[room].lightOn?'Lamba açıldı.':'Lamba kapandı.'); break;
    case 'view': openSheet('weather'); break;
    case 'lights': openSheet('slot',{room,slot:'lights'}); break;
    case 'cat': toast(S.companion.name+' mırlıyor.'); break;
    case 'tv': { const w=watchingNow(); w?openSheet('media',{id:w.id}):go('films'); break; }
    case 'tapes': go('films'); break;
    case 'planrack': go('films',{scrollTo:'#mplanned'}); break;
    case 'posters': toast('İzlediğin bir yapımı favori yapınca afişi burada belirir.'); break;
    case 'music': openSheet('sound'); break;
  }
}

function shelfRows(entries,maxW,unit=3,gap=2){
  const rows=[[]]; let w=0;
  for(const r of entries){ const sp=spineFor(S.books[r.bookId]); const bw=Math.max(14,sp.w*unit+4); if(w+bw>maxW&&rows[rows.length-1].length){ rows.push([]); w=0; } rows[rows.length-1].push({r,sp,bw}); w+=bw+gap; }
  return rows;
}

/* ---------------- Filmler ---------------- */
function tapeRows(entries,maxW){
  const rows=[[]]; let w=0;
  for(const e of entries){ const m=S.media[e.mediaId]; const n=m.kind==='series'?m.seasons||1:1; const bw=n*18+(n>1?4:0); if(w+bw>maxW&&rows[rows.length-1].length){rows.push([]);w=0;} rows[rows.length-1].push(e); w+=bw+3; }
  return rows;
}
function tapeHtml(e){
  const m=S.media[e.mediaId]; const n=m.kind==='series'?m.seasons||1:1; const ws=e.seasonsWatched||[];
  const one=(k)=>`<span class="tape${m.kind==='series'&&e.status==='watched'&&!ws.includes(k+1)?' faded':''}" style="--c:${m.spineColor}"><span class="lbl">${k===0?esc(m.title):'S'+(k+1)}</span></span>`;
  return `<button class="tapeset${n>1?' box':''}${UI.highlight&&UI.highlight.id===e.id?' glow':''}" data-act="media" data-id="${e.id}" aria-label="${esc(m.title)}">${Array.from({length:n},(_,k)=>one(k)).join('')}</button>`;
}
function viewFilms(){
  const watched=watchedList(), planned=plannedMedia();

  return `

/* ---------------- Mağaza ---------------- */
function shopItems(tab){
  const def=SHOP_TABS.find(t=>t.key===tab)||SHOP_TABS[0];
  if(!def.types) return CATALOG.filter(i=>i.price>0&&owns(i.id));
  return CATALOG.filter(i=>def.types.includes(i.type)).sort((a,b)=>def.types.indexOf(a.type)-def.types.indexOf(b.type));
}
function itemStatus(it){
  if(it.type==='cat') return S.companion.itemId===it.id?'Yanında':owns(it.id)?'Sahip':null;
  const w=whereIs(it.id);
  if(it.price===0) return 'Başlangıç';
  if(w.length) return it.multi?w.map(x=>ROOMS[x.room].name).join(', '):ROOMS[w[0].room].name;
  return owns(it.id)?'Sahip':null;
}
function viewShop(){
  const items=shopItems(UI.shopTab), bal=balance();
  return `

const Sheets={};
const sheetHead=(title,eyebrow='')=>`<div class="sheet-head"><div>${eyebrow?`<div class="eyebrow small">${eyebrow}</div>`:''}<h2>${title}</h2></div><button class="icon-btn" data-act="closeSheet" aria-label="Kapat">${ic('close')}</button></div>`;

Sheets.rooms=()=>sheetHead('Evim')+`<div class="room-grid">${ROOM_ORDER.map(k=>{const thumb={reading:'sofa_terra',tv:'tv_crt',balcony:'chair_wicker'}[k];return `<button class="room-card ${UI.room===k?'on':''}" data-act="room" data-room="${k}"><div class="thumb"><canvas data-thumb="${S.rooms[k].slots[{reading:'sofa',tv:'tv',balcony:'chair'}[k]]||thumb}"></canvas></div><b>${ROOMS[k].name}</b><small>${ROOMS[k].hint}</small></button>`;}).join('')}<div class="room-card soon"><div class="thumb"></div><b>Yeni oda</b><small>İleride</small></div></div>`;

Sheets.slot=({room,slot})=>{
  const type=SLOT_TYPE[slot], cur=S.rooms[room].slots[slot];
  const sel=UI.preview&&UI.preview.slot===slot?UI.preview.itemId:cur;
  const items=CATALOG.filter(i=>i.type===type).sort((a,b)=>(owns(b.id)-owns(a.id))||(a.price-b.price));
  const it=ITEM[sel], need=!owns(sel), bal=balance();
  const elsewhere=!it.multi&&it.price>0?whereIs(sel).filter(w=>!(w.room===room&&w.slot===slot)):[];
  let action;
  if(sel===cur) action=`<button class="btn wide ghost" data-act="closeSheet">Kapat</button>`;
  else if(need) action=bal>=it.price?`<button class="btn wide" data-act="buyPlace" data-id="${sel}" data-room="${room}" data-slot="${slot}">${fmt(it.price)} jetonla al ve yerleştir</button>`:`<button class="btn wide" disabled>${fmt(it.price-bal)} jeton eksik · ~${Math.ceil((it.price-bal)/ECONOMY.avgPerBook)} kitap</button>`;
  else action=`<button class="btn wide" data-act="placeSel" data-id="${sel}" data-room="${room}" data-slot="${slot}">Buraya yerleştir</button>`;
  return sheetHead(TYPE_LABEL[type],ROOMS[room].name.toLocaleUpperCase('tr-TR'))+
   `<p class="muted">Seçtiğin eşya yukarıda önizlenir; onaylamadan hiçbir şey değişmez.</p>
   <div class="pick-grid">${items.map(i=>{const o=owns(i.id);return `<button class="pick ${i.id===sel?'sel':''} ${o?'':'locked'}" data-act="preview" data-id="${i.id}" data-room="${room}" data-slot="${slot}"><div class="thumb ${i.type}"><canvas data-thumb="${i.id}"></canvas></div><b>${esc(i.name)}</b><small>${i.id===cur?'Burada':o?'Sahip':`<i class="coin-dot"></i>${fmt(i.price)}`}</small></button>`;}).join('')}</div>
   ${elsewhere.length?`<p class="note">Bu eşya şu an ${ROOMS[elsewhere[0].room].name} odasında. Buraya taşınırsa oradaki yeri başlangıç eşyasına döner; ikinci kopya oluşmaz.</p>`:''}
   <div class="sheet-actions">${action}</div>`;
};

Sheets.item=({id})=>{
  const it=ITEM[id], o=owns(id), bal=balance();
  let body='';
  if(it.type==='cat'){
    body = !o?(bal>=it.price?`<button class="btn wide" data-act="buy" data-id="${id}">${fmt(it.price)} jetonla al</button>`:`<button class="btn wide" disabled>${fmt(it.price-bal)} jeton eksik</button>`)
      : S.companion.itemId===id?`<p class="muted">Şu an yanında.</p>`:`<button class="btn wide" data-act="setCat" data-id="${id}">Yol arkadaşım olsun</button>`;
  } else if(!o){
    body = bal>=it.price?`<button class="btn wide" data-act="buy" data-id="${id}">${fmt(it.price)} jetonla al</button>`:`<button class="btn wide" disabled>${fmt(it.price-bal)} jeton eksik · yaklaşık ${Math.ceil((it.price-bal)/ECONOMY.avgPerBook)} kitap</button>`;

     <div class="center muted">${it.price?`<i class="coin-dot"></i> ${fmt(it.price)} jeton`:'Başlangıç eşyası'}${it.multi?' · birden fazla odada kullanılabilir':''}${it.id==='music_vinyl'?' · Plak çıtırtısı kanalına eşlik eder':''}</div>

    :`<div class="rate">${[1,2,3,4,5].map(n=>`<button class="${(r.rating||0)>=n?'on':''}" data-act="rate" data-id="${id}" data-v="${n}" aria-label="${n} yıldız">${ic('star',26)}</button>`).join('')}</div>`;

/* ================= Eylemler ================= */
function syncAudio(){
  if(!S) return;
  const room=UI.tab==='home'?UI.room:S.lastRoom, mix=S.rooms[room].mix, volumes={};
  for(const c of CHANNELS) volumes[c.key]=Number(mix[c.key])||0;
  if(mix.piano) volumes[mix.piano]=Number(mix.pianoVol)||0;
  Native.call('audio',{playing:!!S.prefs.soundOn,volumes}).catch(()=>{});
}
function safe(fn){ try{ return fn(); }catch(e){ toast(e.message||'İşlem tamamlanamadı.','warn'); return undefined; } }

Object.assign(Actions,{
  room:d=>{ UI.room=d.room; S.lastRoom=d.room; persist(); if(UI.tab!=='home') UI.tab='home'; if(UI.sheet) closeSheet(); render(); syncAudio(); },
  rooms:()=>openSheet('rooms'),
  edit:()=>{ UI.edit=!UI.edit; UI.preview=null; render(); if(UI.edit) toast('Kesikli çizgili eşyalara dokun.'); },
  collection:()=>openSheet('collection'),
  weather:()=>openSheet('weather'),
  sound:()=>openSheet('sound'),
  settings:()=>openSheet('settings'),
  companion:()=>openSheet('companion'),
  add:d=>{ UI.form=freshForm(d.kind||'book'); openSheet('add',{kind:d.kind||'book'}); },
  formKind:d=>{ UI.form=freshForm(d.v); if(UI.sheet) UI.sheet.args.kind=d.v; renderSheet(); },
  formSet:d=>{ UI.form[d.k]=d.v; renderSheet(); },
  formIn:(d,el)=>{ UI.form[d.k]=el.value; },
  submitAdd:()=>safe(()=>{
    const f=UI.form;
    if(f.kind==='book'){
      const pages=String(f.pages||'').replace(/\D/g,'');
      const {entry,existed}=addBook({title:f.title,author:f.author,pages,status:f.status==='read'?'planned':f.status,color:f.color});
      persistNow(); UI.form=null;
      if(f.status==='read'){ openSheet('finish',{id:entry.id}); return; }
      closeSheet(); toast(existed?'Bu kitap zaten listende.':f.status==='reading'?'Sehpana koydum. İyi okumalar.':'Okunacaklar yığınına eklendi.');
      UI.room='reading'; go('home',{room:'reading'});
    } else {
      const entry=addMedia({title:f.title,kind:f.mkind,year:String(f.year||'').replace(/\D/g,''),seasons:f.seasons,status:f.status});
      persistNow(); UI.form=null; closeSheet();
      UI.highlight={kind:'media',id:entry.id,until:Date.now()+5000};
      toast(entry.status==='watched'?'Kaset rafına yerleşti.':entry.status==='watching'?'Televizyonda açık.':'İzleyeceklerine eklendi.');
      go('home',{room:'tv'}); syncAudio();
    }
  }),
  finish:d=>openSheet('finish',{id:d.id}),
  confirmFinish:d=>safe(()=>{
    const r=S.reading.find(x=>x.id===d.id); if(!r) return;
    const gained=finishBook(r); persistNow();
    closeSheet(); UI.highlight={kind:'book',id:r.id,until:Date.now()+6000};
    go('home',{room:'reading'}); bumpCoins(gained); syncAudio();
    toast(gained?`+${gained} jeton · kitabın rafına yerleşti.`:'Kitabın rafına yerleşti.');
  }),
  book:d=>{ UI.confirmDel=null; openSheet('book',{id:d.id}); },
  startBook:d=>{ const r=S.reading.find(x=>x.id===d.id); if(!r) return; startReading(r); persist(); if(UI.sheet) closeSheet(); render(); toast('Sehpana koydum. İyi okumalar.'); },
  planBook:d=>{ const r=S.reading.find(x=>x.id===d.id); if(!r) return; planAgain(r); persist(); closeSheet(); render(); },
  rate:d=>{ const r=S.reading.find(x=>x.id===d.id); if(!r) return; r.rating=Number(d.v)===r.rating?0:Number(d.v); persist(); renderSheet(); if(UI.tab==='books') render(); },
  askDel:d=>{ UI.confirmDel=d.id; renderSheet(); },
  delBook:d=>{ const r=S.reading.find(x=>x.id===d.id); if(!r) return; removeBook(r); persistNow(); UI.confirmDel=null; closeSheet(); render(); toast('Kitap silindi.'); },
  booksView:d=>{ UI.booksView=d.v; render(); },
  sort:d=>{ S.prefs.shelfSort=d.v; persist(); render(); },
  media:d=>{ UI.confirmDel=null; openSheet('media',{id:d.id}); },
  watched:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; setWatch(e,'watched'); persistNow(); if(UI.sheet) closeSheet(); UI.highlight={kind:'media',id:e.id,until:Date.now()+5000}; go('home',{room:'tv'}); toast('Kaset rafına yerleşti.'); },
  watching:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; setWatch(e,'watching'); persist(); closeSheet(); go('home',{room:'tv'}); toast('Televizyonda açık.'); },
  mplan:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; setWatch(e,'planned'); e.favorite=false; persist(); closeSheet(); render(); },
  fav:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; if(!e.favorite&&S.watch.filter(w=>w.favorite).length>=2) S.watch.find(w=>w.favorite).favorite=false; e.favorite=!e.favorite; persist(); renderSheet(); Scene.redraw(); },
  season:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; const n=Number(d.v); const set=new Set(e.seasonsWatched||[]); set.has(n)?set.delete(n):set.add(n); e.seasonsWatched=[...set].sort((a,b)=>a-b); persist(); renderSheet(); Scene.redraw(); },
  delMedia:d=>{ const e=S.watch.find(x=>x.id===d.id); if(!e) return; removeMedia(e); persistNow(); UI.confirmDel=null; closeSheet(); render(); toast('Kayıt silindi.'); },
  shopTab:d=>{ UI.shopTab=d.v; render(); },
  item:d=>openSheet('item',{id:d.id}),
  buy:d=>safe(()=>{ const it=ITEM[d.id]; if(buy(d.id)){ persistNow(); bumpCoins(0); toast(it.name+' senin.'); if(UI.tab==='shop') render(); renderSheet(); } }),
  placeHere:d=>safe(()=>{ place(d.id,d.room,d.slot); persistNow(); closeSheet(); go('home',{room:d.room}); toast(ITEM[d.id].name+' yerleşti.'); }),
  preview:d=>{ UI.preview={room:d.room,slot:d.slot,itemId:d.id}; Scene.redraw(); renderSheet(); },
  placeSel:d=>safe(()=>{ place(d.id,d.room,d.slot); UI.preview=null; persistNow(); closeSheet(); Scene.redraw(); toast(ITEM[d.id].name+' yerleşti.'); }),
  buyPlace:d=>safe(()=>{ buy(d.id); place(d.id,d.room,d.slot); UI.preview=null; persistNow(); closeSheet(); render(); bumpCoins(0); toast(ITEM[d.id].name+' senin. Odana yerleşti.'); }),
  setCat:d=>safe(()=>{ setCompanion(d.id); persist(); renderHeader(); renderSheet(); Scene.redraw(); }),
  catName:(d,el)=>{ S.companion.name=el.value.slice(0,24)||'Mırnav'; persist(); },
  pref:d=>{ const v=d.v==='true'?true:d.v==='false'?false:d.v; S.prefs[d.k]=v; persist(); renderSheet(); if(d.k==='animations') render(); else Scene.redraw(); },
  soundToggle:()=>{ S.prefs.soundOn=!S.prefs.soundOn; persist(); renderSheet(); syncAudio(); },
  mix:(d,el)=>{ S.rooms[d.room].mix[d.k]=Number(el.value); const em=el.parentElement.querySelector('em'); if(em) em.textContent=el.value+'%'; persist(); clearTimeout(Actions._mixT); Actions._mixT=setTimeout(syncAudio,150); },
  piano:d=>{ S.rooms[d.room].mix.piano=d.v; if(!S.rooms[d.room].mix.pianoVol) S.rooms[d.room].mix.pianoVol=25; persist(); renderSheet(); syncAudio(); },
  closeWelcome:()=>{ S.prefs.intro=true; persistNow(); closeSheet(); },
});


/* browser.js */
'use strict';
/* Tarayıcı önizlemesi (ONIZLEME.html): telefon köprüsü yoksa kayıt localStorage'a yazılır, ses çalmaz.
   Telefonda (Expo Go) bu dosya hiçbir şey yapmaz. */
if(!window.ReactNativeWebView){
  const KEY='lumaraf-onizleme-v1';
  window.PreviewNative={
    async call(type,payload){
      if(type==='load'){ try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch{ return null; } }
      if(type==='save'){ try{ localStorage.setItem(KEY,JSON.stringify(payload.state)); }catch{} return true; }
      return true;
    }
  };
}


/* main.js */
'use strict';
/* Açılış: kaydı yükle → normalize → çiz. */
(async function boot(){
  try{
    const saved=await Native.call('load');
    if(saved){ S=normalize(saved); }
    else { S=freshState(); await persistNow(); }
  }catch(e){
    // Kayıt okunamadıysa üzerine yazmayız (R-VER): yalnızca uyarı gösteririz.
    document.getElementById('view').innerHTML='<div class="card hint" style="margin-top:40px"><div class="serif">Kayıt okunamadı.</div><p class="muted">'+esc(e.message)+'</p><p class="muted">Dosyaların silinmedi. Uygulamayı kapatıp yeniden aç; sorun sürerse bu mesajı paylaş.</p></div>';
    return;
  }
  UI.room=S.lastRoom||'reading';
  render();
  Native.call('ready').catch(()=>{});
  syncAudio();
  if(!S.prefs.intro) setTimeout(()=>openSheet('welcome'),350);
  window.addEventListener('resize',()=>{ if(UI.tab!=='home') render(); else Scene.redraw(); });
})();
</script>
